name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.0"
          arch: "win64_msvc2019_64"
          cache: true

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Package
        run: cmake --build build --config Release --target package --parallel

      - name: Test deployed package
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem build -Filter "Xake-*.zip" -File)
          if ($archives.Count -ne 1) {
            throw "Expected one Xake package, found $($archives.Count)."
          }
          $packageDirectory = Join-Path $env:RUNNER_TEMP "xake-package"
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $packageDirectory
          ./tools/test_windows_package.ps1 -PackageDirectory $packageDirectory
